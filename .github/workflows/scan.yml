name: RSI Recovery Scan

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which scan to run"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - india
          - usa
  schedule:
    # India: 18:00 IST daily. IST = UTC+5:30 all year (no DST) -> 12:30 UTC.
    - cron: "30 12 * * *"
    # USA: 17:00 ET daily. ET flips between EDT (UTC-4) and EST (UTC-5),
    # so we fire at both possible UTC times and let a same-day guard step
    # decide which one actually matches 17:00 local New York time.
    - cron: "0 21 * * *"   # 17:00 EDT (roughly Mar-Nov)
    - cron: "0 22 * * *"   # 17:00 EST (roughly Nov-Mar)

permissions:
  contents: write

jobs:
  india:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.target == 'india' || github.event.inputs.target == 'both')
      || github.event.schedule == '30 12 * * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies from requirements.yml
        run: |
          python -m pip install --upgrade pip pyyaml
          python - <<'EOF'
          import yaml, subprocess
          with open('requirements.yml') as f:
              deps = yaml.safe_load(f)['dependencies']
          subprocess.check_call(['pip', 'install'] + deps)
          EOF

      - name: Run India scanner
        run: python india/rsi_recovery_scanner_india.py

      - name: Publish as index.html
        run: mv india/rsi_recovery_scanner_india.html india/index.html

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add india/index.html
          git commit -m "Update India RSI recovery scan $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git pull --rebase
          git push

  usa:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.target == 'usa' || github.event.inputs.target == 'both')
      || github.event.schedule == '0 21 * * *' || github.event.schedule == '0 22 * * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies from requirements.yml
        run: |
          python -m pip install --upgrade pip pyyaml
          python - <<'EOF'
          import yaml, subprocess
          with open('requirements.yml') as f:
              deps = yaml.safe_load(f)['dependencies']
          subprocess.check_call(['pip', 'install'] + deps)
          EOF

      - name: Guard - only proceed at 17:00 ET (handles EDT/EST switch)
        id: checktime
        run: |
          HOUR=$(TZ='America/New_York' date +%H)
          echo "Current ET hour: $HOUR"
          if [ "$HOUR" = "17" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run USA scanner
        if: steps.checktime.outputs.proceed == 'true'
        run: python usa/rsi_recovery_scanner.py

      - name: Publish as index.html
        if: steps.checktime.outputs.proceed == 'true'
        run: mv usa/rsi_recovery_scanner.html usa/index.html

      - name: Commit and push report
        if: steps.checktime.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usa/index.html
          git commit -m "Update USA RSI recovery scan $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git pull --rebase
          git push
